name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generated-files:
    name: Generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/build.py --check
      - run: python scripts/build_dashboard.py --check
      - run: bash -n scripts/install.sh

  pipeline:
    name: Pipeline tests (Elasticsearch ${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ["8.15.3", "9.1.5"]
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.stack }}
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          cluster.routing.allocation.disk.threshold_enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline and templates
        run: ./scripts/install.sh
        env:
          ES_URL: http://localhost:9200
          KIBANA_URL: ""
      - name: Run sample logs through the pipeline
        run: python tests/test_pipeline.py
        env:
          ES_URL: http://localhost:9200

  dashboard:
    name: Dashboard import (Kibana ${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ["8.15.3", "9.1.5"]
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.stack }}
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          cluster.routing.allocation.disk.threshold_enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s --health-timeout 5s --health-retries 30
      kibana:
        image: docker.elastic.co/kibana/kibana:${{ matrix.stack }}
        env:
          ELASTICSEARCH_HOSTS: http://elasticsearch:9200
        ports:
          - 5601:5601
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for Kibana
        run: |
          for i in $(seq 120); do
            curl -fs http://localhost:5601/api/status | grep -q '"level":"available"' && exit 0
            sleep 5
          done
          echo "Kibana did not become available" >&2
          exit 1
      - name: Install pipeline, templates and dashboard
        run: ./scripts/install.sh
        env:
          ES_URL: http://localhost:9200
          KIBANA_URL: http://localhost:5601
      - name: Load demo data
        run: python scripts/demo_data.py --hours 2
        env:
          ES_URL: http://localhost:9200
      - name: Check the dashboard and its panels exist
        run: python tests/check_kibana.py
        env:
          KIBANA_URL: http://localhost:5601
