---
# Ingest pipeline for ISC Kea DHCP server logs (kea-dhcp4, kea-dhcp6,
# kea-dhcp-ddns, and kea-ctrl-agent on Kea releases older than 2.7.2).
#
# Parses the default Kea logger layouts:
#   file / stdout / stderr: %D{%Y-%m-%d %H:%M:%S.%q} %-5p [%c/%i.%t] %m\n
#   syslog:                 %-5p [%c.%t] %m\n
# Older Kea releases omit the thread id (".%t"); both forms are accepted.
#
# This file is the source of truth. logs-kea.dhcp.json next to it is
# generated by scripts/build.py for pasting into Kibana Dev Tools.
description: Parse ISC Kea DHCP server logs into ECS fields
_meta:
  project: https://github.com/jmaughmer/elastic-kea_dhcp
  version: 1.1.0
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: "8.17.0"
  - set:
      tag: set_event_original
      field: event.original
      copy_from: message
      if: ctx.event?.original == null && ctx.message != null
  - grok:
      tag: grok_kea_header
      description: Split the Kea log layout into header fields and the message text.
      field: event.original
      pattern_definitions:
        KEA_LEVEL: "FATAL|ERROR|WARN|INFO|DEBUG"
        KEA_LOGGER: "[^/\\]\\s]+"
        # Lazy so that a trailing ".<thread id>" is not swallowed into the logger name.
        KEA_SYSLOG_LOGGER: "[^/\\]\\s]+?"
        KEA_MSGID: "[A-Z][A-Z0-9_]+"
        KEA_SYSLOG_PREFIX: "(?:%{TIMESTAMP_ISO8601:_tmp.syslog_timestamp}|%{SYSLOGTIMESTAMP:_tmp.syslog_timestamp}) +%{SYSLOGHOST:host.hostname} +%{PROG}(?:\\[%{POSINT:process.pid:long}\\])?: +"
        GREEDYMULTILINE: "(?:.|\\n)*"
      patterns:
        # File / console layout.
        - "^%{TIMESTAMP_ISO8601:_tmp.timestamp} +%{KEA_LEVEL:log.level} +\\[%{KEA_LOGGER:log.logger}/%{POSINT:process.pid:long}(?:\\.%{POSINT:process.thread.id:long})?\\] +(?:%{KEA_MSGID:event.code} +)?%{GREEDYMULTILINE:message}"
        # Syslog layout, with or without the syslog header still attached.
        - "^(?:%{KEA_SYSLOG_PREFIX})?%{KEA_LEVEL:log.level} +\\[%{KEA_SYSLOG_LOGGER:log.logger}(?:\\.%{POSINT:process.thread.id:long})?\\] +(?:%{KEA_MSGID:event.code} +)?%{GREEDYMULTILINE:message}"
  - date:
      tag: date_kea_timestamp_tz
      field: _tmp.timestamp
      target_field: "@timestamp"
      formats:
        - "yyyy-MM-dd HH:mm:ss.SSS"
        - "yyyy-MM-dd HH:mm:ss.SSSSSS"
        - "yyyy-MM-dd HH:mm:ss"
      timezone: "{{{event.timezone}}}"
      if: ctx._tmp?.timestamp != null && ctx.event?.timezone != null
  - date:
      tag: date_kea_timestamp
      description: Kea writes local time without an offset. Without event.timezone, assume UTC.
      field: _tmp.timestamp
      target_field: "@timestamp"
      formats:
        - "yyyy-MM-dd HH:mm:ss.SSS"
        - "yyyy-MM-dd HH:mm:ss.SSSSSS"
        - "yyyy-MM-dd HH:mm:ss"
      if: ctx._tmp?.timestamp != null && ctx.event?.timezone == null
  - date:
      tag: date_syslog_timestamp
      field: _tmp.syslog_timestamp
      target_field: "@timestamp"
      formats:
        - ISO8601
        - "MMM  d HH:mm:ss"
        - "MMM d HH:mm:ss"
        - "MMM dd HH:mm:ss"
      timezone: "{{{event.timezone}}}"
      if: ctx._tmp?.syslog_timestamp != null && ctx.event?.timezone != null
  - date:
      tag: date_syslog_timestamp_utc
      field: _tmp.syslog_timestamp
      target_field: "@timestamp"
      formats:
        - ISO8601
        - "MMM  d HH:mm:ss"
        - "MMM d HH:mm:ss"
        - "MMM dd HH:mm:ss"
      if: ctx._tmp?.syslog_timestamp != null && ctx.event?.timezone == null
  - lowercase:
      tag: lowercase_log_level
      field: log.level
      ignore_missing: true
  - grok:
      tag: grok_logger
      description: "kea-dhcp4.leases -> process.name kea-dhcp4, kea.logger.component leases"
      field: log.logger
      patterns:
        - "^%{DATA:process.name}(?:\\.%{GREEDYDATA:kea.logger.component})?$"
      ignore_missing: true
  - script:
      tag: script_service
      description: >-
        Derive the Kea service from the process name, and the protocol and IP
        family for DHCP and DNS activity. API, command, HA and hook management
        messages are not DHCP traffic, so they get no network fields.
      lang: painless
      if: ctx.process?.name != null
      params:
        non_traffic_components: [auth, http, commands, ha-hooks, hooks, dctl]
      source: |
        String p = ctx.process.name;
        ctx.service = ctx.service ?: new HashMap();
        ctx.service.type = 'kea';
        ctx.service.name = p;
        String c = ctx.kea?.logger?.component;
        if (c != null && (params.non_traffic_components.contains(c) || c.endsWith('-cmds-hooks'))) {
          return;
        }
        ctx.network = ctx.network ?: new HashMap();
        if (p == 'kea-dhcp4') {
          ctx.network.protocol = 'dhcp';
          ctx.network.type = 'ipv4';
        } else if (p == 'kea-dhcp6') {
          ctx.network.protocol = 'dhcpv6';
          ctx.network.type = 'ipv6';
        } else if (p == 'kea-dhcp-ddns') {
          ctx.network.protocol = 'dns';
        }
        if (ctx.network.isEmpty()) {
          ctx.remove('network');
        }

  # Client identification label, e.g.
  #   v4: [hwtype=1 08:00:2b:02:3f:4e], cid=[01:08:00:2b:02:3f:4e], tid=0x3d18f5e4
  #   v6: duid=[00:03:00:01:08:00:2b:02:3f:4e], [hwtype=1 08:00:2b:02:3f:4e], tid=0x9cc3a7
  - grok:
      tag: grok_client_label
      field: message
      pattern_definitions:
        KEA_HWADDR: "(?:[0-9a-fA-F]{2}(?::[0-9a-fA-F]{2})*)?"
        KEA_HW: "\\[(?:hwtype=%{INT:kea.client.hwtype:long} %{KEA_HWADDR:kea.client.hwaddr}|no hwaddr info)\\]"
        KEA_TID: "0x[0-9a-fA-F]+"
      patterns:
        - "duid=\\[(?:no info|%{DATA:kea.client.duid})\\], %{KEA_HW}, tid=%{KEA_TID:kea.transaction_id}"
        - "%{KEA_HW}, cid=\\[(?:no info|%{DATA:kea.client.id})\\], tid=%{KEA_TID:kea.transaction_id}"
      if: ctx.message instanceof String && ctx.message.contains('tid=0x')
      ignore_failure: true

  # Lease details.
  - grok:
      tag: grok_lease
      field: message
      pattern_definitions:
        KEA_V6_LEASE: "(?:address %{IP:kea.lease.address}|prefix %{IP:kea.lease.address}/%{NONNEGINT:kea.lease.prefix_length:long}) and iaid=%{NONNEGINT:kea.lease.iaid:long}"
      patterns:
        - "lease %{IP:kea.lease.address} has been (?:allocated|reused) for %{NONNEGINT:kea.lease.duration:long} seconds"
        - "lease %{IP:kea.lease.address} will be (?:offered|advertised)"
        - "address %{IP:kea.lease.address} was released properly"
        - "DHCPDECLINE for addr %{IP:kea.lease.address}"
        - "lease for %{KEA_V6_LEASE} has been (?:allocated|reused) for %{NONNEGINT:kea.lease.duration:long} seconds"
        - "(?:lease|binding) for %{KEA_V6_LEASE}"
        - "(?:lease|address|addr|prefix) %{IP:kea.lease.address}(?:/%{NONNEGINT:kea.lease.prefix_length:long})?"
      if: ctx.event?.code instanceof String && (ctx.event.code.startsWith('DHCP4_') || ctx.event.code.startsWith('DHCP6_') || ctx.event.code.startsWith('ALLOC_ENGINE_') || ctx.event.code.startsWith('DHCPSRV_'))
      ignore_failure: true
  - grok:
      tag: grok_lease_duration
      field: message
      patterns:
        - "(?:for|in) %{NONNEGINT:kea.lease.duration:long} seconds"
      if: ctx.kea?.lease?.address != null && ctx.kea.lease.duration == null && ctx.message.contains(' seconds')
      ignore_failure: true

  # Subnet, shared network and allocation details.
  - grok:
      tag: grok_subnet
      field: message
      patterns:
        - "in the subnet %{NOTSPACE:kea.subnet.prefix}, subnet-id %{NONNEGINT:kea.subnet.id:long}, shared network (?:\\(none\\)|%{GREEDYDATA:kea.shared_network.name})"
        - "subnet with ID %{NONNEGINT:kea.subnet.id:long}"
        - "subnet-id %{NONNEGINT:kea.subnet.id:long}"
        - "subnet %{NONNEGINT:kea.subnet.id:long}"
      if: ctx.message instanceof String && ctx.message.contains('subnet')
      ignore_failure: true
  - grok:
      tag: grok_alloc_attempts
      field: message
      patterns:
        - "after %{NONNEGINT:kea.allocation.attempts:long} attempt"
      if: ctx.event?.code instanceof String && ctx.event.code.startsWith('ALLOC_ENGINE_') && ctx.message.contains('attempt')
      ignore_failure: true
  - grok:
      tag: grok_alloc_classes
      field: message
      patterns:
        - "client with classes: %{GREEDYDATA:_tmp.classes}"
      if: ctx.event?.code instanceof String && ctx.event.code.endsWith('_ALLOC_FAIL_CLASSES')
      ignore_failure: true
  - split:
      tag: split_classes
      field: _tmp.classes
      separator: ",\\s*"
      target_field: kea.client.classes
      ignore_missing: true

  # Packet logs (debug level). Example:
  #   ...: DHCPDISCOVER (type 1) received from 0.0.0.0 to 255.255.255.255 on interface eth0
  #   ...: trying to send packet DHCPOFFER (type 2) from 192.0.2.1:67 to 192.0.2.10:68 on interface eth0
  - grok:
      tag: grok_packet
      field: message
      patterns:
        - "%{NOTSPACE:kea.dhcp.message_type} \\(type %{NONNEGINT:kea.dhcp.message_type_code:long}\\) received from %{IP:source.ip} to %{IP:destination.ip} on interface %{NOTSPACE:observer.ingress.interface.name}"
        - "send(?:ing)? packet %{NOTSPACE:kea.dhcp.message_type} \\(type %{NONNEGINT:kea.dhcp.message_type_code:long}\\) from \\[?%{IP:source.ip}\\]?:%{POSINT:source.port:long} to \\[?%{IP:destination.ip}\\]?:%{POSINT:destination.port:long} on interface %{NOTSPACE:observer.egress.interface.name}"
      if: ctx.event?.code instanceof String && (ctx.event.code.endsWith('_PACKET_RECEIVED') || ctx.event.code.endsWith('_PACKET_SEND'))
      ignore_failure: true

  # Server lifecycle and high availability.
  - grok:
      tag: grok_version
      field: message
      patterns:
        - "server version %{NOTSPACE:service.version}"
        - "version:? %{NOTSPACE:service.version}"
      if: ctx.event?.code instanceof String && (ctx.event.code.endsWith('_STARTING') || ctx.event.code.endsWith('_STARTED'))
      ignore_failure: true
  # HA_STATE_TRANSITION carries the partner's state; passive-backup mode logs
  # HA_STATE_TRANSITION_PASSIVE_BACKUP, which has no partner state.
  - grok:
      tag: grok_ha_state
      field: message
      patterns:
        - "transitions from %{NOTSPACE:kea.ha.previous_state} to %{NOTSPACE:kea.ha.state} state(?:, partner state is %{NOTSPACE:kea.ha.partner_state})?"
      if: ctx.event?.code instanceof String && ctx.event.code.startsWith('HA_STATE_TRANSITION')
      ignore_failure: true
  # Most HA messages start with this server's HA name ("dhcp01: ..."); some
  # name the partner, with its URL when Kea knows it.
  #   HA_SYNC_SUCCESSFUL dhcp01: lease database synchronization with dhcp02 (https://192.0.2.3:8001/) completed ...
  #   HA_LOCAL_DHCP_ENABLE local DHCP service is enabled while the dhcp01 is in the HOT-STANDBY state
  - grok:
      tag: grok_ha_names
      field: message
      pattern_definitions:
        KEA_HA_NAME: "[^\\s:()]+"
      patterns:
        - "^local DHCP service is (?:enabled|disabled) while the %{KEA_HA_NAME:kea.ha.server_name} is in the %{NOTSPACE:kea.ha.state} state"
        - "^(?:HA )?%{KEA_HA_NAME:kea.ha.server_name}: (?:.*? )?(?:with|to|from|by) %{KEA_HA_NAME:kea.ha.partner_name} \\(%{URI:kea.ha.partner_url}\\)"
        - "^(?:HA )?%{KEA_HA_NAME:kea.ha.server_name}: communication with %{KEA_HA_NAME:kea.ha.partner_name} is interrupted"
        - "^(?:HA )?%{KEA_HA_NAME:kea.ha.server_name}: "
      if: ctx.event?.code instanceof String && ctx.event.code.startsWith('HA_')
      ignore_failure: true

  # Control API (served by the daemons on Kea 2.7.2+, by kea-ctrl-agent before).
  #   COMMAND_RECEIVED Received command 'config-get'
  #   HTTP_CLIENT_REQUEST_AUTHORIZED received HTTP request authorized for 'admin'
  #   HTTP_CONNECTION_HANDSHAKE_FAILED TLS handshake with 192.0.2.50 failed with peer did not return a certificate (SSL routines)
  - grok:
      tag: grok_command
      field: message
      patterns:
        - "[Rr]eceived command '%{DATA:kea.command}'"
        - "rejected command '%{DATA:kea.command}'"
      if: ctx.event?.code == 'COMMAND_RECEIVED' || ctx.event?.code == 'COMMAND_HTTP_LISTENER_COMMAND_REJECTED'
      ignore_failure: true
  - grok:
      tag: grok_api
      field: message
      patterns:
        - "authorized for '%{DATA:user.name}'"
        - "TLS handshake with \\[?%{IP:source.ip}\\]?(?::%{POSINT:source.port:long})? failed with %{GREEDYDATA:event.reason}"
        - "malformed authentication header: %{GREEDYDATA:event.reason}"
      if: ctx.event?.code instanceof String && ctx.event.code.startsWith('HTTP_')
      ignore_failure: true

  - script:
      tag: script_categorize
      description: Map Kea message ids to ECS event.action, event.category, event.type and event.outcome.
      lang: painless
      params:
        exact:
          DHCP4_LEASE_ALLOC: [lease-allocated, network, allowed, success]
          DHCP6_LEASE_ALLOC: [lease-allocated, network, allowed, success]
          DHCP6_PD_LEASE_ALLOC: [lease-allocated, network, allowed, success]
          DHCP4_LEASE_REUSE: [lease-reused, network, allowed, success]
          DHCP6_LEASE_REUSE: [lease-reused, network, allowed, success]
          DHCP6_PD_LEASE_REUSE: [lease-reused, network, allowed, success]
          DHCP4_LEASE_OFFER: [lease-offered, network, protocol, success]
          DHCP4_LEASE_ADVERT: [lease-offered, network, protocol, success]
          DHCP6_LEASE_ADVERT: [lease-offered, network, protocol, success]
          DHCP6_PD_LEASE_ADVERT: [lease-offered, network, protocol, success]
          DHCP4_RELEASE: [lease-released, network, end, success]
          DHCP6_RELEASE_NA: [lease-released, network, end, success]
          DHCP6_RELEASE_PD: [lease-released, network, end, success]
          DHCP4_DECLINE_LEASE: [lease-declined, network, denied, failure]
          DHCP6_DECLINE_LEASE: [lease-declined, network, denied, failure]
          # The ping check hook found the address answering before it was offered.
          DHCP4_SERVER_INITIATED_DECLINE: [lease-declined, network, denied, failure]
          DHCP4_INIT_REBOOT: [init-reboot, network, protocol, ""]
          DHCP4_NO_LEASE_INIT_REBOOT: [lease-not-found, network, info, failure]
          ALLOC_ENGINE_V4_LEASE_RECLAIM: [lease-reclaimed, network, end, ""]
          ALLOC_ENGINE_V6_LEASE_RECLAIM: [lease-reclaimed, network, end, ""]
          DHCP4_PACKET_RECEIVED: [packet-received, network, protocol, ""]
          DHCP6_PACKET_RECEIVED: [packet-received, network, protocol, ""]
          DHCP4_PACKET_SEND: [packet-sent, network, protocol, ""]
          DHCP6_PACKET_SEND: [packet-sent, network, protocol, ""]
          DHCP4_SUBNET_SELECTION_FAILED: [subnet-selection-failed, network, denied, failure]
          DHCP6_SUBNET_SELECTION_FAILED: [subnet-selection-failed, network, denied, failure]
          DHCP4_STARTED: [server-started, process, start, success]
          DHCP6_STARTED: [server-started, process, start, success]
          DHCP_DDNS_STARTED: [server-started, process, start, success]
          CTRL_AGENT_STARTED: [server-started, process, start, success]
          DHCP4_SHUTDOWN: [server-stopped, process, end, success]
          DHCP6_SHUTDOWN: [server-stopped, process, end, success]
          DCTL_SHUTDOWN: [server-stopped, process, end, success]
          # Configuration: loaded at start-up, reloaded on SIGHUP / config-reload
          # (`systemctl reload`), or set through the API. CONFIG_COMPLETE is
          # logged every time, so config-applied counts each load once.
          DHCP4_CONFIG_COMPLETE: [config-applied, configuration, change, success]
          DHCP6_CONFIG_COMPLETE: [config-applied, configuration, change, success]
          DCTL_CONFIG_COMPLETE: [config-applied, configuration, change, success]
          DHCP4_DYNAMIC_RECONFIGURATION: [config-reload-requested, configuration, change, ""]
          DHCP6_DYNAMIC_RECONFIGURATION: [config-reload-requested, configuration, change, ""]
          DCTL_CFG_FILE_RELOAD_SIGNAL_RECVD: [config-reload-requested, configuration, change, ""]
          DHCP4_CONFIG_LOAD_FAIL: [config-failed, configuration, error, failure]
          DHCP6_CONFIG_LOAD_FAIL: [config-failed, configuration, error, failure]
          DHCP4_DYNAMIC_RECONFIGURATION_FAIL: [config-failed, configuration, error, failure]
          DHCP6_DYNAMIC_RECONFIGURATION_FAIL: [config-failed, configuration, error, failure]
          DHCP4_CONFIG_UNRECOVERABLE_ERROR: [config-failed, configuration, error, failure]
          DHCP6_CONFIG_UNRECOVERABLE_ERROR: [config-failed, configuration, error, failure]
          DCTL_CFG_FILE_RELOAD_ERROR: [config-failed, configuration, error, failure]
          DCTL_CONFIG_FILE_LOAD_FAIL: [config-failed, configuration, error, failure]
          # Control API.
          COMMAND_RECEIVED: [command-received, process, info, ""]
          COMMAND_HTTP_LISTENER_COMMAND_REJECTED: [api-command-rejected, network, denied, failure]
          HTTP_CLIENT_REQUEST_AUTHORIZED: [api-auth-succeeded, authentication, start, success]
          HTTP_CLIENT_REQUEST_NOT_AUTHORIZED: [api-auth-failed, authentication, start, failure]
          HTTP_CLIENT_REQUEST_NO_AUTH_HEADER: [api-auth-failed, authentication, start, failure]
          HTTP_CLIENT_REQUEST_BAD_AUTH_HEADER: [api-auth-failed, authentication, start, failure]
          HTTP_CONNECTION_HANDSHAKE_FAILED: [tls-handshake-failed, network, connection, failure]
          # High availability.
          HA_STATE_TRANSITION: [ha-state-changed, configuration, change, ""]
          HA_STATE_TRANSITION_PASSIVE_BACKUP: [ha-state-changed, configuration, change, ""]
          HA_SERVICE_STARTED: [ha-service-started, process, start, success]
          HA_COMMUNICATION_INTERRUPTED: [ha-communication-interrupted, network, connection, failure]
          HA_HEARTBEAT_COMMUNICATIONS_FAILED: [ha-heartbeat-failed, network, connection, failure]
          HA_HEARTBEAT_FAILED: [ha-heartbeat-failed, network, connection, failure]
          HA_SYNC_SUCCESSFUL: [ha-sync-completed, database, change, success]
          HA_SYNC_FAILED: [ha-sync-failed, database, error, failure]
          HA_LEASES_SYNC_FAILED: [ha-sync-failed, database, error, failure]
          HA_LEASES_SYNC_COMMUNICATIONS_FAILED: [ha-sync-failed, database, error, failure]
          HA_LEASE_SYNC_FAILED: [ha-sync-failed, database, error, failure]
          HA_LEASES_BACKLOG_FAILED: [ha-lease-update-failed, database, error, failure]
          HA_LEASES_BACKLOG_COMMUNICATIONS_FAILED: [ha-lease-update-failed, database, error, failure]
          HA_TERMINATED: [ha-terminated, process, end, failure]
          HA_TERMINATED_PARTNER_DID_NOT_RESTART: [ha-terminated, process, end, failure]
          HA_HIGH_CLOCK_SKEW_CAUSED_TERMINATION: [ha-terminated, process, end, failure]
          HA_LEASE_UPDATE_REJECTS_CAUSED_TERMINATION: [ha-terminated, process, end, failure]
        prefix:
          ALLOC_ENGINE_V4_ALLOC_FAIL: [allocation-failed, network, denied, failure]
          ALLOC_ENGINE_V6_ALLOC_FAIL: [allocation-failed, network, denied, failure]
          DHCP4_PACKET_NAK: [packet-nak, network, denied, failure]
          DHCP4_PACKET_DROP: [packet-dropped, network, denied, failure]
          DHCP6_PACKET_DROP: [packet-dropped, network, denied, failure]
          # HA_LEASE_UPDATE_FAILED, _COMMUNICATIONS_FAILED, _CONFLICT, ..._FAILED_ON_PEER.
          # (HA_LEASE_UPDATES_ENABLED / _DISABLED do not match: "UPDATES_".)
          HA_LEASE_UPDATE_: [ha-lease-update-failed, database, error, failure]
          HA_INVALID_PARTNER_STATE_: [ha-invalid-partner-state, process, error, failure]
        reasons:
          DHCP4_DECLINE_LEASE: client reported the address in use
          DHCP6_DECLINE_LEASE: client reported the address in use
          DHCP4_SERVER_INITIATED_DECLINE: server found the address in use (ping check)
      source: |
        ctx.event = ctx.event ?: new HashMap();
        ctx.event.kind = 'event';
        ctx.event.module = 'kea';
        ctx.event.dataset = ctx.event.dataset ?: 'kea.dhcp';
        String code = ctx.event.code;
        List m = null;
        if (code != null) {
          m = params.exact.get(code);
          if (m == null) {
            for (def e : params.prefix.entrySet()) {
              if (code.startsWith(e.getKey())) {
                m = e.getValue();
                break;
              }
            }
          }
        }
        String level = ctx.log?.level;
        boolean isError = level == 'error' || level == 'fatal';
        if (m != null) {
          ctx.event.action = m[0];
          ctx.event.category = [m[1]];
          ctx.event.type = [m[2]];
          if (m[3] != '') {
            ctx.event.outcome = m[3];
          }
          if (isError && !ctx.event.type.contains('error')) {
            ctx.event.type.add('error');
          }
        } else {
          boolean net = ctx.kea?.client != null || ctx.process?.name == 'kea-dhcp-ddns';
          ctx.event.category = [net ? 'network' : 'process'];
          ctx.event.type = [isError ? 'error' : 'info'];
        }
        if (isError && ctx.event.outcome == null) {
          ctx.event.outcome = 'failure';
        }
        if (code != null && ctx.event.reason == null && params.reasons.containsKey(code)) {
          ctx.event.reason = params.reasons.get(code);
        }
        if (code != null && code.startsWith('HTTP_')) {
          ctx.network = ctx.network ?: new HashMap();
          ctx.network.protocol = 'http';
        }

  # Warnings Kea logs at every start and reload when multi-threading is on
  # (the default since Kea 2.3). They need no action; the dashboard leaves
  # events with this tag out of its error and warning counts.
  - append:
      tag: append_expected_warning
      field: tags
      value: kea_expected_warning
      allow_duplicates: false
      if: >-
        ['DHCP4_RESERVATIONS_LOOKUP_FIRST_ENABLED', 'DHCP6_RESERVATIONS_LOOKUP_FIRST_ENABLED',
        'DHCPSRV_MT_DISABLED_QUEUE_CONTROL'].contains(ctx.event?.code)

  # ECS client fields.
  - script:
      tag: script_client
      lang: painless
      if: ctx.kea?.client != null || ctx.kea?.lease != null
      params:
        # Actions after which the client holds (or is being handed) the lease address.
        client_ip_actions: [lease-allocated, lease-reused, lease-offered, lease-released]
      source: |
        def kc = ctx.kea.client;
        if (kc != null && kc.hwaddr != null && kc.hwaddr != '') {
          ctx.client = ctx.client ?: new HashMap();
          ctx.client.mac = kc.hwaddr.toUpperCase().replace(':', '-');
        }
        def kl = ctx.kea.lease;
        if (kl != null && kl.address != null) {
          kl.type = kl.prefix_length != null ? 'prefix' : 'address';
          if (kl.type == 'address' && params.client_ip_actions.contains(ctx.event?.action)) {
            ctx.client = ctx.client ?: new HashMap();
            ctx.client.ip = kl.address;
          }
        }
  - append:
      tag: append_related_ip_lease
      field: related.ip
      value: "{{{kea.lease.address}}}"
      allow_duplicates: false
      if: ctx.kea?.lease?.address != null
  - append:
      tag: append_related_ip_source
      field: related.ip
      value: "{{{source.ip}}}"
      allow_duplicates: false
      if: ctx.source?.ip != null
  - append:
      tag: append_related_ip_destination
      field: related.ip
      value: "{{{destination.ip}}}"
      allow_duplicates: false
      if: ctx.destination?.ip != null
  - append:
      tag: append_related_hosts
      field: related.hosts
      value: "{{{host.hostname}}}"
      allow_duplicates: false
      if: ctx.host?.hostname != null
  - append:
      tag: append_related_user
      field: related.user
      value: "{{{user.name}}}"
      allow_duplicates: false
      if: ctx.user?.name != null

  - remove:
      tag: remove_tmp
      field: _tmp
      ignore_missing: true
  - remove:
      tag: remove_event_original
      field: event.original
      ignore_missing: true
      if: ctx.tags == null || !ctx.tags.contains('preserve_original_event')
  - pipeline:
      tag: pipeline_custom
      description: Optional hook for site-specific processing.
      name: logs-kea.dhcp@custom
      ignore_missing_pipeline: true

on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: "Processor '{{{ _ingest.on_failure_processor_type }}}' with tag '{{{ _ingest.on_failure_processor_tag }}}' in pipeline '{{{ _ingest.on_failure_pipeline }}}' failed with message '{{{ _ingest.on_failure_message }}}'"
  - append:
      field: tags
      value: kea_parse_failure
      allow_duplicates: false
